<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenShinobi | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#f1f0ea; --ink:#202226; --muted:#5f646f; --line:#202226; --blue:#c5d8e8; --yellow:#f1df93; --violet:#cdbce6; --surface:#f7f4ec; --card-dark:#1f2125; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "DM Sans", sans-serif; color: var(--ink); background: radial-gradient(circle at 20% 0%, #f6f4ef 0%, var(--bg) 35%, #e7edf4 100%); }
        .container { width: min(1200px, 93vw); margin: 0 auto; }
        .nav { position: sticky; top: 0; z-index: 10; padding: 20px 0; backdrop-filter: blur(6px); }
        .bar { background: #f3f4f6; border: 2px solid var(--line); border-radius: 999px; padding: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .brand { font-family: "Abril Fatface", serif; font-size: 30px; margin-left: 12px; }
        .toolbar { display: flex; align-items: center; gap: 8px; }
        .ghost, .danger, .primary { border: 2px solid var(--line); border-radius: 999px; padding: 10px 16px; background: #fffaf0; font-weight: 700; cursor: pointer; font-family: inherit; }
        .ghost { background: #f7f8fb; }
        .danger { background: #f3c5c5; }
        .primary { background: var(--blue); }
        main { padding: 18px 0 48px; }
        .hero { margin-bottom: 18px; }
        .hero h1 { margin: 0; font-family: "Fraunces", serif; font-size: clamp(34px, 5vw, 58px); font-weight: 300; line-height: 1.1; }
        .hero p { margin: 8px 0 0; color: var(--muted); }
        .grid { display: grid; grid-template-columns: 380px 1fr; gap: 18px; }
        .panel { border: 2px solid var(--line); border-radius: 24px; background: var(--surface); padding: 20px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .tile { border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
        .tile.blue { background: var(--blue); }
        .tile.yellow { background: var(--yellow); }
        .tile p { margin: 0; font-weight: 700; }
        .tile h3 { margin: 4px 0 0; font-family: "Abril Fatface", serif; font-size: 34px; }
        label { display:block; font-size:13px; text-transform: uppercase; font-weight: 700; letter-spacing: .04em; margin:10px 0 6px; }
        input { width:100%; border:2px solid var(--line); border-radius: 12px; background: #fffdf4; padding: 11px 12px; font-size: 15px; }
        .form-actions { display:flex; gap:8px; margin-top:12px; flex-wrap: wrap; }
        #project-cancel.hidden, .hidden { display:none; }
        #project-status { margin-top: 10px; }
        #projects-empty { border:2px dashed var(--line); border-radius: 18px; padding: 18px; color: var(--muted); background: #f9f7ef; }
        #projects-list article { border:2px solid var(--line); border-radius: 18px; padding: 14px; background: #fffdf4; margin-bottom: 12px; }
        .article-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .article-actions { display:flex; gap:6px; flex-wrap: wrap; }
        .article-actions button { border-radius: 12px; border: 2px solid var(--line); padding: 6px 10px; font-weight: 700; background: #f7f8fb; cursor: pointer; }
        .article-actions .danger { background: #f3c5c5; }
        .meta { color: var(--muted); margin: 6px 0; word-break: break-all; }
        .copy-row { display:flex; gap:6px; flex-wrap: wrap; margin-top: 10px; }
        .copy-row button { border-radius: 12px; border: 2px solid var(--line); padding: 6px 10px; font-weight: 700; background: var(--blue); cursor: pointer; }

        @media (max-width: 990px) {
            .grid { grid-template-columns: 1fr; }
            .bar { border-radius: 20px; }
            .brand { font-size: 24px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container bar">
            <div class="brand">TokenShinobi</div>
            <div class="toolbar">
                <div id="auth-badge">Session</div>
                <button id="logout-button" type="button" class="ghost">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h1>Dashboard for authentication projects</h1>
            <p>Create apps, manage credentials, and ship login links quickly.</p>
        </section>

        <div class="grid">
            <section class="panel">
                <div class="stats">
                    <div class="tile blue">
                        <p>Apps</p>
                        <h3 id="project-count">0</h3>
                    </div>
                    <a class="tile yellow" href="/user/register?switch=1" style="text-decoration:none;color:inherit;display:block;">
                        <p>Owner setup</p>
                        <h3 style="font-size:24px">New account</h3>
                    </a>
                </div>

                <h2 style="margin:0; font-family:'Abril Fatface',serif; font-size:34px;">Project Studio</h2>
                <small id="form-mode-label" style="color:var(--muted)">Create mode</small>
                <form id="project-form">
                    <input id="project-edit-client-id" type="hidden">
                    <label for="applicationName">Project name</label>
                    <input id="applicationName" name="applicationName" type="text" required placeholder="Acme Dashboard">
                    <label for="contactEmail">Contact email</label>
                    <input id="contactEmail" name="contactEmail" type="email" required placeholder="team@acme.com">
                    <label for="applicationUrl">Project URL</label>
                    <input id="applicationUrl" name="applicationUrl" type="url" required placeholder="https://app.example.com">
                    <label for="redirectUrl">Redirect URL</label>
                    <input id="redirectUrl" name="redirectUrl" type="url" required placeholder="https://app.example.com/auth/callback">
                    <div class="form-actions">
                        <button id="project-submit" class="primary" type="submit">Create project</button>
                        <button id="project-cancel" class="ghost hidden" type="button">Cancel</button>
                    </div>
                </form>
                <div id="project-status" class="hidden"></div>
            </section>

            <section class="panel">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <h2 style="margin:0; font-family:'Abril Fatface',serif; font-size:34px;">Your Applications</h2>
                    <small style="color:var(--muted)">Manage credentials and links</small>
                </div>
                <div id="projects-empty">No projects yet. Create your first application.</div>
                <div id="projects-list" class="hidden"></div>
            </section>
        </div>
    </main>

    <script>
        const tokenKey = "hexauth-access-token";
        const userKey = "hexauth-user";
        const themeStorageKey = "hexauth-theme";
        const themes = {
            light: {
                "--bg": "#f1f0ea",
                "--ink": "#202226",
                "--muted": "#5f646f",
                "--line": "#202226",
                "--blue": "#c5d8e8",
                "--yellow": "#f1df93",
                "--violet": "#cdbce6",
                "--surface": "#f7f4ec",
                "--card-dark": "#1f2125"
            }
        };
        const logoutButton = document.getElementById("logout-button");
        const projectForm = document.getElementById("project-form");
        const projectStatus = document.getElementById("project-status");
        const projectsList = document.getElementById("projects-list");
        const projectsEmpty = document.getElementById("projects-empty");
        const projectCount = document.getElementById("project-count");
        const authBadge = document.getElementById("auth-badge");
        const projectSubmit = document.getElementById("project-submit");
        const projectCancel = document.getElementById("project-cancel");
        const projectEditClientId = document.getElementById("project-edit-client-id");
        const formModeLabel = document.getElementById("form-mode-label");

        const getTheme = () => "light";
        const setTheme = (theme) => {
            Object.entries(themes[theme]).forEach(([key, value]) => document.documentElement.style.setProperty(key, value));
            document.documentElement.dataset.theme = theme;
            localStorage.setItem(themeStorageKey, theme);
        };

        const getToken = () => localStorage.getItem(tokenKey);
        const getUser = () => {
            const value = localStorage.getItem(userKey);
            return value ? JSON.parse(value) : null;
        };

        const clearSession = () => {
            localStorage.removeItem(tokenKey);
            localStorage.removeItem(userKey);
        };

        const setStatus = (element, message, type) => {
            element.textContent = message;
            element.className = "";
            element.classList.remove("hidden");
            element.style.border = "2px solid";
            element.style.padding = "10px";
            element.style.borderRadius = "10px";
            element.style.borderColor = type === "error" ? "#8a1f1f" : "var(--line)";
            element.style.background = type === "error" ? "#efc8c8" : "#fffdf4";
            element.style.color = "var(--ink)";

            if (type !== "error") {
                setTimeout(() => {
                    element.classList.add("hidden");
                }, 3000);
            }
        };

        const authHeaders = () => ({
            "Content-Type": "application/json",
            "Authorization": `Bearer ${getToken()}`
        });

        const copyToClipboard = async (value, successMessage) => {
            await navigator.clipboard.writeText(value);
            setStatus(projectStatus, successMessage, "info");
        };

        const downloadCredentials = (project) => {
            const signinUrl = `${window.location.origin}/user/login?client_id=${encodeURIComponent(project.clientId)}&redirect_uri=${encodeURIComponent(project.redirectUrl)}`;
            const signupUrl = `${window.location.origin}/user/register?client_id=${encodeURIComponent(project.clientId)}&redirect_uri=${encodeURIComponent(project.redirectUrl)}`;
            const content = [
                `TokenShinobi Project: ${project.applicationName}`,
                `Client ID: ${project.clientId}`,
                `Client Secret: ${project.clientSecret}`,
                `Application URL: ${project.applicationUrl}`,
                `Redirect URL: ${project.redirectUrl}`,
                `Signin URL: ${signinUrl}`,
                `Signup URL: ${signupUrl}`
            ].join("\n");
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${project.applicationName.toLowerCase().replace(/[^a-z0-9]+/g, "-") || "tokenshinobi-project"}-credentials.txt`;
            link.click();
            URL.revokeObjectURL(url);
        };

        const resetForm = () => {
            projectForm.reset();
            projectEditClientId.value = "";
            projectSubmit.textContent = "Create project";
            formModeLabel.textContent = "Create mode";
            projectCancel.classList.add("hidden");
            projectStatus.classList.add("hidden");
        };

        const beginEdit = (project) => {
            projectEditClientId.value = project.clientId;
            projectForm.applicationName.value = project.applicationName;
            projectForm.contactEmail.value = project.contactEmail;
            projectForm.applicationUrl.value = project.applicationUrl;
            projectForm.redirectUrl.value = project.redirectUrl;
            projectSubmit.textContent = "Update project";
            formModeLabel.textContent = `Editing`;
            projectCancel.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        projectCancel.addEventListener("click", resetForm);

        const renderProjects = (projects) => {
            projectCount.textContent = projects.length;
            projectsEmpty.classList.toggle("hidden", projects.length > 0);
            projectsList.classList.toggle("hidden", projects.length === 0);

            const byId = new Map(projects.map((project) => [project.clientId, project]));

            projectsList.innerHTML = projects.map((project) => {
                const signinUrl = `${window.location.origin}/user/login?client_id=${encodeURIComponent(project.clientId)}&redirect_uri=${encodeURIComponent(project.redirectUrl)}`;

                return `
                    <article>
                        <div class="article-head">
                            <div>
                                <h3 style="margin:0; font-family:'Abril Fatface',serif; font-size:32px;">${project.applicationName}</h3>
                                <small style="color:var(--muted)">${project.contactEmail}</small>
                            </div>
                            <div class="article-actions">
                                <button data-edit="${project.clientId}">Edit</button>
                                <button data-download="${project.clientId}">Download</button>
                                <button data-delete="${project.clientId}" class="danger">Delete</button>
                            </div>
                        </div>
                        <p class="meta"><strong>Client ID:</strong> ${project.clientId}</p>
                        <p class="meta"><strong>Client Secret:</strong> ************</p>
                        <p class="meta"><strong>App URL:</strong> ${project.applicationUrl}</p>
                        <p class="meta"><strong>Redirect URL:</strong> ${project.redirectUrl}</p>
                        <p class="meta"><strong>Signin URL:</strong> ${signinUrl}</p>
                        <div class="copy-row">
                          <button data-copy="clientId" data-project="${project.clientId}">Copy Client ID</button>
                          <button data-copy="clientSecret" data-project="${project.clientId}">Copy Secret</button>
                          <button data-copy="signinUrl" data-project="${project.clientId}">Copy Login URL</button>
                        </div>
                    </article>
                `;
            }).join("");

            projectsList.querySelectorAll("[data-edit]").forEach((button) => {
                button.addEventListener("click", () => beginEdit(byId.get(button.dataset.edit)));
            });

            projectsList.querySelectorAll("[data-download]").forEach((button) => {
                button.addEventListener("click", () => downloadCredentials(byId.get(button.dataset.download)));
            });

            projectsList.querySelectorAll("[data-copy]").forEach((button) => {
                button.addEventListener("click", async () => {
                    try {
                        const project = byId.get(button.dataset.project);

                        if (!project) {
                            return;
                        }

                        const lookup = {
                            clientId: project.clientId,
                            clientSecret: project.clientSecret,
                            signinUrl: `${window.location.origin}/user/login?client_id=${encodeURIComponent(project.clientId)}&redirect_uri=${encodeURIComponent(project.redirectUrl)}`,
                            signupUrl: `${window.location.origin}/user/register?client_id=${encodeURIComponent(project.clientId)}&redirect_uri=${encodeURIComponent(project.redirectUrl)}`
                        };

                        const messages = {
                            clientId: "Client ID copied to clipboard",
                            clientSecret: "Client secret copied to clipboard",
                            signinUrl: "Login URL copied to clipboard",
                            signupUrl: "Register URL copied to clipboard"
                        };

                        await copyToClipboard(lookup[button.dataset.copy], messages[button.dataset.copy]);
                    } catch (error) {
                        setStatus(projectStatus, error.message || "Copy failed", "error");
                    }
                });
            });

            projectsList.querySelectorAll("[data-delete]").forEach((button) => {
                button.addEventListener("click", async () => {
                    if (!confirm("Are you sure you want to delete this project? This cannot be undone.")) return;
                    try {
                        const response = await fetch(`/client/${encodeURIComponent(button.dataset.delete)}`, {
                            method: "DELETE",
                            headers: authHeaders()
                        });
                        const result = await response.json();

                        if (!response.ok || !result.success) {
                            throw new Error(result.message || "Delete failed");
                        }

                        setStatus(projectStatus, "Project deleted.", "info");
                        await loadProjects();
                    } catch (error) {
                        setStatus(projectStatus, error.message || "Delete failed", "error");
                    }
                });
            });
        };

        const loadProjects = async () => {
            const token = getToken();
            const user = getUser();

            if (!token || !user) {
                window.location.href = `/user/login?next=${encodeURIComponent("/dashboard")}`;
                return;
            }

            authBadge.textContent = user.name || user.email || "User";

            try {
                const response = await fetch("/clients", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Unable to load projects");
                }

                renderProjects(result.data);
            } catch (error) {
                clearSession();
                window.location.href = `/user/login?next=${encodeURIComponent("/dashboard")}`;
            }
        };

        projectForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const editingClientId = projectEditClientId.value;
            const payload = {
                applicationName: projectForm.applicationName.value,
                contactEmail: projectForm.contactEmail.value,
                applicationUrl: projectForm.applicationUrl.value,
                redirectUrl: projectForm.redirectUrl.value
            };

            try {
                setStatus(projectStatus, editingClientId ? "Updating..." : "Creating...", "info");
                const response = await fetch(editingClientId ? `/client/${encodeURIComponent(editingClientId)}` : "/client/register", {
                    method: editingClientId ? "PUT" : "POST",
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Save failed");
                }

                resetForm();
                setStatus(projectStatus, editingClientId ? "Project updated successfully." : "Project created successfully.", "info");
                await loadProjects();

                if (!editingClientId) {
                    downloadCredentials(result.data);
                }
            } catch (error) {
                setStatus(projectStatus, error.message || "Save failed", "error");
            }
        });

        logoutButton.addEventListener("click", () => {
            clearSession();
            window.location.href = `/user/login?next=${encodeURIComponent("/dashboard")}`;
        });

        setTheme(getTheme());
        loadProjects();
    </script>
</body>
</html>
