<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenShinobi | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#f1f0ea; --panel:#c5d8e8; --ink:#202226; --muted:#5f646f; --field:#f7f4ec; --line:#202226; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#f6f4ef 0%,var(--bg) 60%); color:var(--ink); font-family:"DM Sans",sans-serif; padding:18px; }
        .card { width:min(430px,100%); background:var(--panel); border:3px solid var(--line); border-radius:10px; padding:30px 26px; box-shadow:8px 8px 0 #000; }
        .brand { text-decoration:none; color:var(--ink); font-family:"Abril Fatface",serif; font-size:30px; }
        h1 { margin:12px 0 6px; font-size:34px; line-height:1; }
        p { margin:0 0 18px; color:var(--muted); font-weight:700; }
        label { display:block; font-size:14px; margin:12px 0 6px; font-weight:700; }
        input { width:100%; border:3px solid var(--line); border-radius:8px; background:var(--field); padding:12px 14px; font-size:18px; box-shadow:5px 5px 0 #000; }
        button { margin-top:26px; width:100%; border:3px solid var(--line); border-radius:8px; background:var(--field); padding:12px; font-size:30px; font-family:"Abril Fatface",serif; box-shadow:5px 5px 0 #000; cursor:pointer; }
        #status { margin-top:12px; }
        .small { margin-top:14px; font-size:14px; color:var(--ink); }
        .small a { color:var(--ink); font-weight:700; }`r`n        .hidden { display:none; }
    </style>
</head>
<body>
    <main class="card">
        <a class="brand" href="/">TokenShinobi</a>
        <h1 id="form-title">Welcome,</h1>
        <p id="helper-copy">sign up to continue</p>
        <div id="client-meta" class="hidden"></div>
        <form id="signup-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required placeholder="Alex Doe">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="alex@example.com">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Password">
            <button id="submit-button" type="submit">Sign up</button>
        </form>
        <div id="status" class="hidden"></div>
        <p class="small">Already have an account? <a id="signin-link" href="/user/login">Sign in</a></p>
    </main>

    <script>
        const tokenKey = "hexauth-access-token";
        const userKey = "hexauth-user";

        const applyTheme = () => {
            const themes = {
                light: {
                    "--bg": "#f1f0ea",
                    "--panel": "#c5d8e8",
                    "--ink": "#202226",
                    "--muted": "#5f646f",
                    "--field": "#f7f4ec",
                    "--line": "#202226"
                }
            };
            Object.entries(themes.light).forEach(([key, value]) => document.documentElement.style.setProperty(key, value));
        };
        applyTheme();

        const params = new URLSearchParams(window.location.search);
        const clientId = params.get("client_id");
        const redirectUri = params.get("redirect_uri");
        const state = params.get("state");
        const nextUrl = params.get("next");
        const switchAccount = params.get("switch") === "1";
        const form = document.getElementById("signup-form");
        const statusBox = document.getElementById("status");
        const clientMeta = document.getElementById("client-meta");
        const signinLink = document.getElementById("signin-link");
        const helperCopy = document.getElementById("helper-copy");
        const formTitle = document.getElementById("form-title");
        const submitButton = document.getElementById("submit-button");

        const setStatus = (message, type) => {
            statusBox.textContent = message;
            statusBox.className = "";
            statusBox.classList.remove("hidden");
            statusBox.style.border = "2px solid";
            statusBox.style.padding = "10px";
            statusBox.style.borderRadius = "8px";
            statusBox.style.borderColor = type === "error" ? "#8a1f1f" : "var(--line)";
            statusBox.style.background = type === "error" ? "#efc8c8" : "var(--field)";
            statusBox.style.color = "var(--ink)";
        };

        const persistSession = (result) => {
            localStorage.setItem(tokenKey, result.accessToken);
            localStorage.setItem(userKey, JSON.stringify(result.user));
        };

        const setOwnerMode = () => {
            signinLink.href = nextUrl ? `/user/login?next=${encodeURIComponent(nextUrl)}` : "/user/login";
            formTitle.textContent = "Welcome,";
            helperCopy.textContent = "sign up to continue";
            submitButton.textContent = "Sign up";
        };

        const setClientMode = async () => {
            signinLink.href = `/user/login${window.location.search}`;
            formTitle.textContent = "Welcome,";
            helperCopy.textContent = "sign up to continue to app";
            submitButton.textContent = "Sign up";

            try {
                const response = await fetch(`/client/meta?client_id=${encodeURIComponent(clientId)}${redirectUri ? `&redirect_uri=${encodeURIComponent(redirectUri)}` : ""}`);
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Unable to load project");
                }

                const { client } = result.data;
                helperCopy.textContent = `sign up to continue to ${client.applicationName}`;
            } catch (error) {
                setStatus(error.message || "Unable to load project", "error");
            }
        };

        if (!clientId && !switchAccount && localStorage.getItem(tokenKey) && localStorage.getItem(userKey)) {
            window.location.href = nextUrl || "/dashboard";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            setStatus("Creating account...", "info");

            const payload = {
                name: form.name.value,
                email: form.email.value,
                password: form.password.value,
                clientId: clientId || undefined,
                redirectUri: redirectUri || undefined,
                state: state || undefined
            };

            try {
                const response = await fetch(window.location.pathname, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || "Register failed");
                }

                if (clientId) {
                    setStatus("Success. Redirecting...", "info");
                    setTimeout(() => {
                        window.location.href = result.data.redirectTo;
                    }, 500);
                    return;
                }

                persistSession(result.data);
                setStatus("Success. Redirecting...", "info");
                setTimeout(() => {
                    window.location.href = nextUrl || "/dashboard";
                }, 350);
            } catch (error) {
                setStatus(error.message || "Register failed", "error");
            }
        });

        if (clientId) {
            setClientMode();
        } else {
            setOwnerMode();
        }
    </script>
</body>
</html>
